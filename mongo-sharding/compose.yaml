services:
  mongo_config_server:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongo_config_server
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-config-data:/data/db
    command: ["--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  mongo_shard1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongo_shard1
    restart: always
    ports:
      - "27018:27018"
    volumes:
      - mongo-shard1-data:/data/db
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  mongo_shard2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongo_shard2
    restart: always
    ports:
      - "27019:27019"
    volumes:
      - mongo-shard2-data:/data/db
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  mongo_router:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongo_router
    restart: always
    ports:
      - "27020:27020"
    command:
      ["mongos", "--configdb", "config_server/mongo_config_server:27017", "--bind_ip_all", "--port", "27020"]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongo_config_server
      - mongo_shard1
      - mongo_shard2
      - mongo_router
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongo_router:27020"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  mongo-config-data:
  mongo-shard1-data:
  mongo-shard2-data:

